{% extends 'base.html' %}

{% block title %}Sign In - Milestone Management{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
    <div class="max-w-md w-full space-y-6 bg-slate-900/80 p-8 rounded-2xl border border-slate-800 shadow-2xl backdrop-blur-xl">
        
        <!-- Header -->
        <div class="text-center">
            <div class="mx-auto w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20 mb-4">
                <i data-lucide="gantt-chart" class="w-7 h-7 text-white"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white tracking-tight">
                Sign in to your account
            </h2>
        </div>

        <!-- Login Form -->
        <form class="mt-6 space-y-4" method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-medium text-slate-300 mb-1">Username</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <input id="username" name="username" type="text" required autofocus
                           class="block w-full pl-9 pr-3 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                           placeholder="Enter username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input id="password" name="password" type="password" required
                           class="block w-full pl-9 pr-3 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                           placeholder="••••••••">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-md text-xs font-semibold text-white bg-brand-600 hover:bg-brand-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all shadow-brand-500/25">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Sign in to Milestone Management
                </button>
            </div>
        </form>

        <!-- Default Master User Quick Login -->
        <div class="p-3 bg-slate-850/80 border border-amber-500/30 rounded-xl space-y-1.5 text-xs"
             x-data="{ fillMaster() { document.getElementById('username').value='aman'; document.getElementById('password').value='123456'; } }">
            <div class="flex items-center justify-between">
                <span class="font-semibold text-amber-300 flex items-center gap-1.5 text-[11px]">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-amber-400"></i>
                    Default Master Administrator
                </span>
                <button type="button" @click="fillMaster()"
                        class="px-2 py-0.5 rounded bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-[10px] font-bold border border-amber-500/40 transition-colors">
                    Auto-Fill
                </button>
            </div>
            <div class="text-[11px] text-slate-400 font-mono flex items-center justify-between">
                <span>Username: <strong class="text-slate-200">aman</strong></span>
                <span>Password: <strong class="text-slate-200">123456</strong></span>
            </div>
        </div>

        <div class="text-center pt-2 border-t border-slate-800">
            <p class="text-xs text-slate-400">
                Don't have an account?
                <a href="{% url 'register' %}" class="font-medium text-brand-400 hover:text-brand-300">
                    Create new account
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
